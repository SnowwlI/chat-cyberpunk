<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interface Cyberpunk IA</title>

  <!-- Fonte futurista (substituta da Kroigs) -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* Fundo Cyberpunk */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(to bottom, #1a0000, #330000, #4d0000);
      color: #ff3c00;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 90%;
      max-width: 700px;
      background-color: rgba(0, 0, 0, 0.85);
      padding: 20px;
      border: 2px solid #ff3c00;
      border-radius: 10px;
      box-shadow: 0 0 20px #ff3c00a0;
    }

    h1 {
      margin-top: 0;
      text-align: center;
      font-weight: bold;
      font-size: 24px;
      text-shadow: 0 0 5px #ff3c00;
    }

    #chat-box {
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid #ff3c00;
      margin-bottom: 15px;
      background-color: rgba(255, 60, 0, 0.05);
      border-radius: 5px;
    }

    .message {
      margin: 10px 0;
      padding: 10px;
      border-radius: 10px;
      max-width: 70%;
      word-wrap: break-word;
    }

    .user {
      background-color: #ff3c0020;
      align-self: flex-end;
      text-align: right;
      margin-left: auto;
      border: 1px solid #ff3c00;
    }

    .bot {
      background-color: #111;
      border: 1px solid #ff3c00;
    }

    #user-input {
      width: 75%;
      padding: 10px;
      background-color: #1a0000;
      color: #ff3c00;
      border: 1px solid #ff3c00;
      border-radius: 5px;
    }

    button {
      width: 20%;
      padding: 10px;
      background-color: #ff3c00;
      color: #1a0000;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #ff5e00;
    }
  </style>
</head>

<body>
  <div class="chat-container">
    <h1>PROTOCOLO: CHAT IA - REDNET</h1>
    <div id="chat-box"></div>
    <input type="text" id="user-input" placeholder="Insira sua mensagem..." />
    <button onclick="sendMessage()">ENVIAR</button>
  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById("user-input");
      const message = input.value.trim();
      if (!message) return;

      const chatBox = document.getElementById("chat-box");

      // Mensagem do usuário (à direita)
      const userDiv = document.createElement("div");
      userDiv.classList.add("message", "user");
      userDiv.textContent = "Você: " + message;
      chatBox.appendChild(userDiv);

      input.value = "";

      // Resposta da IA (à esquerda)
      setTimeout(() => {
        const botDiv = document.createElement("div");
        botDiv.classList.add("message", "bot");
        botDiv.textContent = "IA: " + getBotResponse(message);
        chatBox.appendChild(botDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 600);
    }

    function getBotResponse(msg) {
      const m = msg.toLowerCase();
      if (m.includes("olá")) return "Saudações, usuário.";
      if (m.includes("quem é você")) return "Sou uma interface neural conectada à rede vermelha.";
      if (m.includes("sair")) return "Encerrando protocolo...";
      return "Não encontrei protocolo para isso.";
    }
  </script>
</body>
</html>
