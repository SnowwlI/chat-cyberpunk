<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invasão de Rede</title>

  <!-- Anime.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

  <!-- Fonte estilo cyberpunk (Orbitron) -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(135deg, #2B0E12, #0d0907);
      color: #ff3c00;
      overflow: hidden;
    }

    #transition-screen {
      position: fixed;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #2B0E12, #0d0907);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
    }

    .line {
      font-size: 1.2rem;
      margin: 5px 0;
      opacity: 0;
    }

    #main-content {
      display: none;
      padding: 30px;
      text-align: center;
    }

    .glitch {
      animation: glitch 1s infinite;
    }

    @keyframes glitch {
      0% { text-shadow: 2px 0 red; }
      25% { text-shadow: -2px 0 #0ff; }
      50% { text-shadow: 2px 0 red; }
      75% { text-shadow: -2px 0 #0ff; }
      100% { text-shadow: 2px 0 red; }
    }
  </style>
</head>
<body>

  <!-- Transição estilo invasão -->
  <div id="transition-screen">
    <div class="line glitch">> Estabelecendo conexão segura...</div>
    <div class="line glitch">> Decodificando firewall...</div>
    <div class="line glitch">> Acesso concedido.</div>
  </div>

  <!-- Conteúdo do Chat -->
  <div id="main-content">
    <h1>🤖 Interface Neural Conectada</h1>
    <p>Você pode iniciar a conversa com a IA.</p>
  </div>

  <!-- Animação com Anime.js -->
  <script>
    const lines = document.querySelectorAll('.line');
    anime({
      targets: lines,
      opacity: [0, 1],
      delay: anime.stagger(1000), // tempo entre as frases
      easing: 'easeInOutQuad',
      complete: () => {
        // Após a transição, mostra o conteúdo principal
        setTimeout(() => {
          document.getElementById('transition-screen').style.display = 'none';
          document.getElementById('main-content').style.display = 'block';
        }, 1000);
      }
    });
  </script>
</body>
</html>
