<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interface Cyberpunk</title>

  <!-- Anime.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

  <!-- Fonte estilo digital -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(135deg, #2B0E12, #0d0907);
      color: #ff3c00;
      overflow: hidden;
    }

    /* Primeira transição - hacking */
    #transition-screen {
      position: fixed;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #2B0E12, #0d0907);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
    }

    .line {
      font-size: 1.2rem;
      margin: 5px 0;
      opacity: 0;
    }

    .glitch {
      animation: glitch 1s infinite;
    }

    @keyframes glitch {
      0% { text-shadow: 2px 0 red; }
      25% { text-shadow: -2px 0 #0ff; }
      50% { text-shadow: 2px 0 red; }
      75% { text-shadow: -2px 0 #0ff; }
      100% { text-shadow: 2px 0 red; }
    }

    /* Segunda transição - sistema ligando */
    #boot-animation {
      position: fixed;
      width: 100vw;
      height: 100vh;
      background-color: #0d0907;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9998;
      opacity: 0;
    }

    .boot-line {
      width: 0;
      height: 2px;
      background: #ff3c00;
    }

    /* Conteúdo do Chat */
    #main-content {
      display: none;
      padding: 40px;
      text-align: center;
      z-index: 1;
    }

    .chat-box {
      background-color: rgba(0, 0, 0, 0.3);
      border: 1px solid #ff3c00;
      padding: 20px;
      border-radius: 10px;
      margin-top: 30px;
    }

  </style>
</head>
<body>

  <!-- Primeira Transição (hack) -->
  <div id="transition-screen">
    <div class="line glitch">> Estabelecendo conexão segura...</div>
    <div class="line glitch">> Decodificando firewall...</div>
    <div class="line glitch">> Acesso concedido.</div>
  </div>

  <!-- Segunda Transição (boot) -->
  <div id="boot-animation">
    <div class="boot-line"></div>
  </div>

  <!-- Conteúdo final -->
  <div id="main-content">
    <h1>🤖 Interface Neural Conectada</h1>
    <div class="chat-box">
      <p><strong>IA:</strong> Conexão estabelecida. Estou ouvindo.</p>
      <p><strong>Você:</strong> Me ouve?</p>
      <p><strong>IA:</strong> Claramente. Sinais fortes. Pronto para iniciar.</p>
    </div>
  </div>

  <script>
    const lines = document.querySelectorAll('.line');
    const transitionScreen = document.getElementById('transition-screen');
    const boot = document.getElementById('boot-animation');
    const bootLine = document.querySelector('.boot-line');
    const mainContent = document.getElementById('main-content');

    anime({
      targets: lines,
      opacity: [0, 1],
      delay: anime.stagger(1000),
      easing: 'easeInOutQuad',
      complete: () => {
        setTimeout(() => {
          transitionScreen.style.display = 'none';
          boot.style.opacity = 1;

          anime({
            targets: bootLine,
            width: ['0%', '100%'],
            duration: 1000,
            easing: 'easeInOutExpo',
            complete: () => {
              anime({
                targets: bootLine,
                height: ['2px', '100vh'],
                duration: 800,
                easing: 'easeInOutExpo',
                complete: () => {
                  boot.style.display = 'none';
                  mainContent.style.display = 'block';
                }
              });
            }
          });

        }, 1000);
      }
    });
  </script>

</body>
</html>
